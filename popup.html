<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 18px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #101426 0%, #171d38 100%);
      color: #eee;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(233, 69, 96, 0.3);
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 12px;
      color: #10b981;
      font-size: 10px;
      font-weight: 600;
      margin-top: 3px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .features {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 11px;
      line-height: 1.7;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #cbd5e1;
    }
    .feature-item svg {
      width: 13px;
      height: 13px;
      color: #e94560;
      flex-shrink: 0;
    }
    button {
      width: 100%;
      padding: 11px 16px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: linear-gradient(135deg, #e94560 0%, #c73e54 100%);
      color: white;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(233, 69, 96, 0.3);
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(233, 69, 96, 0.45);
    }
    button:active { transform: translateY(0); }
    .footer {
      margin-top: 14px;
      font-size: 11px;
      text-align: center;
      color: #94a3b8;
    }
    .footer a {
      color: #e94560;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 0 5px;
    }
    .footer a:hover { text-decoration: underline; }
    .dev-by {
      display: block;
      margin-top: 10px;
      padding: 8px;
      background: rgba(233, 69, 96, 0.15);
      border: 1px solid rgba(233, 69, 96, 0.35);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="logo.jpg" alt="Inspect Helper" class="logo">
    <div>
      <h1>Inspect Helper</h1>
      <div class="status-badge">
        <span class="status-dot"></span> Active & Protecting
      </div>
    </div>
  </div>

  <div class="features">
    <div class="feature-item">
      <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
      <span>F12 & Ctrl+Shift+I/J/C unblocked</span>
    </div>
    <div class="feature-item">
      <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
      <span>Right-click & Copy enabled</span>
    </div>
    <div class="feature-item">
      <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
      <span>Tab auto-close blocked</span>
    </div>
    <div class="feature-item">
      <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
      <span>Infinite debugger loops neutralized</span>
    </div>
  </div>

  <button id="enable">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
    <span>Force Re-Unlock Page</span>
  </button>

  <div class="footer">
    <a href="https://www.linkedin.com/in/ur-990q" target="_blank" rel="noopener">LinkedIn</a> ·
    <a href="https://github.com/Shivam990q" target="_blank" rel="noopener">GitHub</a>
    <span class="dev-by">Developed by SHIVAM ERP DEV.</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
